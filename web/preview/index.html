<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynse · MCP Apps 界面预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #182230; background: white; font: 13px 'Avenir Next','PingFang SC',sans-serif; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 584px; margin: 22px auto 10px; padding: 0 12px; color: #667085; font-size: 11px; }
  details { position: relative; } summary { cursor: pointer; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; position: absolute; top: 25px; right: 0; width: 310px; padding: 12px; background: white; border: 1px solid #e7e9ed; border-radius: 6px; z-index: 1; }
  nav { display: flex; gap: 12px; } a,button { color: inherit; font: inherit; text-decoration: none; padding: 3px 0; border: 0; background: transparent; cursor: pointer; }
  a[aria-current='page'] { color: #182230; text-decoration: underline; text-underline-offset: 4px; }
  label { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; }
  input { width: 25px; height: 25px; padding: 1px; background: transparent; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; }
  .workspace { max-width: 584px; margin: 0 auto; padding: 0 12px; }
  iframe { display: block; width: 100%; height: 150px; border: 1px solid #e7e9ed; border-radius: 8px; }
  .messages { font-size: 12px; white-space: pre-wrap; line-height: 1.8; margin: 12px 0; }
  body.dark { background: #1b1d21; color: #eef0f3; } body.dark .controls { background: #1b1d21; border-color: #383d45; } body.dark iframe { border-color: #383d45; }
</style></head>
<body>
<header class="toolbar"><span>示例预览 · 聊天栏宽度</span><details><summary>预览设置</summary><div class="controls">
<nav aria-label="界面预览"><a href="/?view=meetings" data-view="meetings">会议</a><a href="/?view=todos" data-view="todos">待办</a><a href="/?view=confirmation" data-view="confirmation">选择确认</a></nav>
<label>强调色 <input id="accent" type="color" value="#0f766e" aria-label="主题强调色"></label>
<button id="theme">切换深色</button></div></details></header>
<main class="workspace"><iframe id="preview-frame" title="灵光记界面" src="/app" sandbox="allow-scripts"></iframe>
<div id="messages" class="messages" aria-live="polite"></div></main>
<script src="/host.js"></script></body></html>
