# Include in the existing HTTPS server that serves /data/RevelSpark/dist.
location = /mcp { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location = /authorize { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location = /token { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location = /register { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location = /revoke { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location = /.well-known/oauth-authorization-server { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location = /.well-known/oauth-protected-resource/mcp { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location ^~ /platform/oauth/api/ { include /opt/lynse-mcp-cn/current/deploy/nginx-lynse-cn-proxy.conf; }
location ^~ /platform/oauth/test { access_log off; return 404; }
location = /platform/oauth {
    alias /opt/lynse-mcp-cn/current/web/mcp-auth.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
}
location = /platform/oauth/wechat {
    alias /opt/lynse-mcp-cn/current/web/mcp-auth.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
}
location ^~ /platform/oauth-static/ {
    alias /opt/lynse-mcp-cn/current/web/;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
}
