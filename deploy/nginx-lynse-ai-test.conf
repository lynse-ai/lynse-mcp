# Include inside the existing www.lynse.ai HTTPS server block.
location = /mcp { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location = /authorize { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location = /token { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location = /register { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location = /revoke { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location = /.well-known/oauth-authorization-server { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location = /.well-known/oauth-protected-resource/mcp { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location ^~ /platform/oauth/api/ { include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf; }
location ^~ /platform/oauth/test {
    include /etc/nginx/snippets/lynse-mcp-ai-test-proxy.conf;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
}
location = /platform/oauth {
    alias /var/www/revelspark/platform/oauth-static/mcp-auth.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
}
location = /platform/oauth/wechat {
    alias /var/www/revelspark/platform/oauth-static/mcp-auth.html;
    default_type text/html;
    access_log off;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag 'noindex, nofollow' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
}
location ^~ /platform/oauth-static/ {
    root /var/www/revelspark;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
