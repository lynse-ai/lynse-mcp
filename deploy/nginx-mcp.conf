# Reference only. Add the mcp virtual host after installing its HTTPS certificate.
# Use actual certificate paths on the ECS host.
server {
    listen 443 ssl;
    server_name mcp.lynse.cn;
    ssl_certificate /etc/letsencrypt/live/mcp.lynse.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.lynse.cn/privkey.pem;
    client_max_body_size 16k;
    # OAuth query parameters and codes must not enter access logs.
    access_log off;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

